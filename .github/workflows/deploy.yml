name: Deploy frontend (main)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Evita que dos deploys se pisen; nunca cancela uno en curso.
concurrency:
  group: deploy-frontend-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    # docker compose interpola estos ${VAR} en docker-compose.yml.
    # Vienen de los Secrets del repo (Settings -> Secrets -> Actions).
    # JWT_SECRET ya no se expone acá: el frontend no verifica firmas de token,
    # así que no hay motivo para materializar el secreto en el runner.
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
    steps:
      # Las dos son build-time o determinan si la cookie de sesion es aceptada.
      # Si llegan vacias el deploy "funciona" y el login falla en silencio, que
      # es mucho mas caro de diagnosticar que fallar aca.
      - name: Verificar secrets requeridos
        run: |
          faltan=""
          [ -n "$NEXT_PUBLIC_API_URL" ] || faltan="$faltan NEXT_PUBLIC_API_URL"
          [ -n "$COOKIE_DOMAIN" ] || faltan="$faltan COOKIE_DOMAIN"
          if [ -n "$faltan" ]; then
            echo "Faltan Secrets del repositorio:$faltan"
            exit 1
          fi
          case "$NEXT_PUBLIC_API_URL" in
            */api|*/api/) ;;
            *) echo "NEXT_PUBLIC_API_URL deberia terminar en /api (endpoints.ts lo concatena): $NEXT_PUBLIC_API_URL"; exit 1 ;;
          esac

      - name: Sync + build + up
        working-directory: /opt/smarttrompa/web
        run: |
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build

      - name: Healthcheck frontend
        working-directory: /opt/smarttrompa/web
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "http://localhost:10801" >/dev/null; then
              echo "Frontend healthy"
              exit 0
            fi
            echo "Intento $i — esperando 10s..."
            sleep 10
          done
          echo "Frontend NO respondio. Logs:"
          docker compose logs --tail=80
          exit 1

      - name: Limpiar imagenes viejas
        if: always()
        run: docker image prune -f
