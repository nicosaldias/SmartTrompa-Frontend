services:
  frontend:
    build:
      context: .
      args:
        # URL pública del backend — se hornea en el bundle del navegador.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        # Backend real integrado (https://udec.c4i-udec.cl:18091).
        NEXT_PUBLIC_MOCK_MODE: "false"
    ports:
      - "10801:3000"
    environment:
      # Sin JWT_SECRET a propósito. El middleware ya no verifica la firma del token
      # (lo hace el backend en cada request, que es donde vive la autorización real).
      # Tener acá el secreto de firma significaba que un compromiso del frontend
      # permitía emitir tokens válidos de cualquier usuario, incluido Administrador.
      # Ver src/middleware.ts.
      # Dominio raíz compartido para que la cookie viaje entre subdominios
      # (rfs.c4i-udec.cl ↔ udec.c4i-udec.cl). En local queda sin definir → host-only.
      COOKIE_DOMAIN: ".c4i-udec.cl"
    restart: unless-stopped
